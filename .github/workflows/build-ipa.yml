name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Prebuild Native iOS Project with CocoaPods
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod repo update || true
          pod install --repo-update

      - name: Build and Package Unsigned IPA for KSign
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          echo "Found workspace: $WORKSPACE"
          
          SCHEME="STYLXHTESTOPS"
          if [ ! -d "ios/$SCHEME.xcodeproj" ]; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | head -n 1 | tr -d ' ')
          fi
          echo "Using scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r -y STYLXHTestOps.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STYLXH-Test-Ops-KSign
          path: STYLXHTestOps.ipa
          retention-days: 14
