name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Compatible Xcode Version
        run: |
          echo "=== Available Xcode Installations ==="
          ls -d /Applications/Xcode*.app || true

          TARGET_XCODE=""
          # Prioritize Xcode 26.0 / 26.1 / 26.2 (providing Swift 6.2) while avoiding 26.3
          for candidate in \
            /Applications/Xcode_26.0*.app \
            /Applications/Xcode_26.1*.app \
            /Applications/Xcode_26.2*.app \
            /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ] && [[ "$candidate" != *"26.3"* ]]; then
              TARGET_XCODE="$candidate"
              break
            fi
          done

          if [ -z "$TARGET_XCODE" ]; then
            echo "::error::No Xcode version with Swift 6.2 was found"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          echo "Selected Xcode: $TARGET_XCODE"
          sudo xcode-select -s "$TARGET_XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$TARGET_XCODE/Contents/Developer" >> "$GITHUB_ENV"

          echo "=== Active Toolchain ==="
          xcodebuild -version
          swift --version

          # Fail early if toolchain does not provide Swift 6.2
          swift --version | grep -q "6.2" || {
            echo "::error::Selected Xcode does not provide Swift 6.2"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build and Package Unsigned IPA for KSign
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE="ios/STYLXHTESTOPS.xcworkspace"
          fi
          echo "Found CocoaPods workspace: $WORKSPACE"
          
          SCHEME="STYLXHTESTOPS"
          echo "Using scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r -y STYLXHTestOps.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STYLXH-Test-Ops-KSign
          path: STYLXHTestOps.ipa
          retention-days: 14
