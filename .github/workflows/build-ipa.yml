name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Compatible Xcode Version
        run: |
          echo "=== Available Xcode Installations ==="
          ls -d /Applications/Xcode*.app || true

          # Find compatible Xcode version between 16.4 and 26.0 (avoiding 26.3 breaking Clang annotations)
          TARGET_XCODE=""
          for candidate in /Applications/Xcode_16.4*.app /Applications/Xcode_26.0*.app /Applications/Xcode_16*.app; do
            if [ -d "$candidate" ] && [[ "$candidate" != *"26.3"* ]]; then
              TARGET_XCODE="$candidate"
              break
            fi
          done

          if [ -z "$TARGET_XCODE" ]; then
            echo "No explicit candidate found, using default available non-26.3 Xcode..."
            TARGET_XCODE=$(ls -d /Applications/Xcode*.app | grep -v "26.3" | tail -n 1)
          fi

          echo "Selected Xcode: $TARGET_XCODE"
          sudo xcode-select -s "$TARGET_XCODE/Contents/Developer"
          export DEVELOPER_DIR="$TARGET_XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$TARGET_XCODE/Contents/Developer" >> $GITHUB_ENV

          echo "=== Active Toolchain ==="
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build and Package Unsigned IPA for KSign
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE="ios/STYLXHTESTOPS.xcworkspace"
          fi
          echo "Found CocoaPods workspace: $WORKSPACE"
          
          SCHEME="STYLXHTESTOPS"
          echo "Using scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r -y STYLXHTestOps.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STYLXH-Test-Ops-KSign
          path: STYLXHTestOps.ipa
          retention-days: 14
